[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ung-lagrange"
version = "0.1.0"
description = "UNG internal authenticated service relay"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*", "ung_lagrange_adapter*"]
